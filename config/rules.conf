# Firewall Rules Configuration
# Format: <name> <action> [options...]
# Options:
#   proto <tcp|udp|icmp|any>
#   src <ip[/mask]>
#   dst <ip[/mask]>
#   sport <port>
#   dport <port>
#   log
#   in
#   out

# Allow loopback
allow_loopback    accept  proto any src 127.0.0.0/8 dst 127.0.0.0/8

# Allow established TCP
allow_established accept  proto tcp in

# Allow SSH
allow_ssh         accept  proto tcp dport 22 in log

# Allow HTTP/HTTPS
allow_http        accept  proto tcp dport 80 in
allow_https       accept  proto tcp dport 443 in

# Allow DNS
allow_dns_udp     accept  proto udp dport 53
allow_dns_tcp     accept  proto tcp dport 53

# Allow ICMP
allow_icmp        accept  proto icmp in

# Block known bad ports
block_telnet      drop    proto tcp dport 23 in log
block_ftp         drop    proto tcp dport 21 in log
block_telnet_alt  drop    proto tcp dport 2323 in log
block_netbus      drop    proto tcp dport 12345 in log
block_backdoor    drop    proto tcp dport 31337 in log
block_trojan      drop    proto tcp dport 4444 in log

# Block suspicious source ranges
block_bad_net     drop    src 10.10.10.0/24 proto any in log

# Default: drop everything else
default_drop      drop    proto any
